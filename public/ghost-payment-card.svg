<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0720" />
      <stop offset="40%" stop-color="#1e0b36" />
      <stop offset="80%" stop-color="#2a0d4a" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="telebirrBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cbePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7e22ce" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Card Background Outer Frame -->
  <rect x="10" y="10" width="780" height="460" rx="32" fill="url(#cardBg)" stroke="url(#purpleGlow)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Subtle Grid/Cyber Texture Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 10 70 H 790 M 10 130 H 790 M 10 190 H 790 M 10 250 H 790 M 10 310 H 790 M 10 370 H 790 M 10 430 H 790" />
    <path d="M 90 10 V 470 M 170 10 V 470 M 250 10 V 470 M 330 10 V 470 M 410 10 V 470 M 490 10 V 470 M 570 10 V 470 M 650 10 V 470 M 730 10 V 470" />
  </g>

  <!-- Top Banner / Header -->
  <g transform="translate(45, 45)">
    <!-- Ghost Icon -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="28" fill="#1e1b4b" stroke="url(#purpleGlow)" stroke-width="3" />
      <path d="M 20 40 C 20 20, 40 20, 40 40 C 40 44, 35 44, 30 40 C 25 44, 20 44, 20 40 Z" fill="#ffffff" />
      <circle cx="25" cy="28" r="3" fill="#000000" />
      <circle cx="35" cy="28" r="3" fill="#000000" />
      <path d="M 26 34 Q 30 38 34 34" stroke="#d946ef" stroke-width="2" fill="none" />
    </g>

    <text x="75" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="2">GHOST GAME ZONE</text>
    <text x="75" y="48" fill="#a855f7" font-family="monospace" font-size="14" letter-spacing="3">OFFICIAL GAMING &amp; PAYMENT CARD</text>
  </g>

  <!-- VIP Badge Top Right -->
  <g transform="translate(630, 42)">
    <rect x="0" y="0" width="125" height="38" rx="10" fill="url(#goldAccent)" stroke="#fef08a" stroke-width="1.5" />
    <text x="62.5" y="24" fill="#000000" font-family="system-ui, sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="2">VIP PASS</text>
  </g>

  <!-- EMV Chip & Contactless Wave -->
  <g transform="translate(45, 125)">
    <!-- Chip -->
    <rect x="0" y="0" width="65" height="48" rx="8" fill="url(#goldAccent)" stroke="#fef08a" stroke-width="2" />
    <path d="M 0 24 H 65 M 22 0 V 48 M 43 0 V 48 M 22 16 H 43 M 22 32 H 43" stroke="#854d0e" stroke-width="1.5" fill="none" />
    <!-- Contactless -->
    <path d="M 85 12 A 18 18 0 0 1 85 36 M 93 6 A 26 26 0 0 1 93 42 M 101 0 A 34 34 0 0 1 101 48" stroke="#a855f7" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- FIFA & Gaming Station Tag -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="195" height="42" rx="12" fill="#110c2a" stroke="#8b5cf6" stroke-width="2" />
    <text x="97.5" y="26" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle" letter-spacing="1">FIFA 15 ETB / MATCH</text>
  </g>

  <!-- Payment Methods Badges Row -->
  <g transform="translate(45, 205)">
    <!-- TELEBIRR -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="75" rx="16" fill="url(#telebirrBlue)" stroke="#38bdf8" stroke-width="2" />
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">telebirr</text>
      <text x="20" y="55" fill="#e0f2fe" font-family="monospace" font-weight="bold" font-size="13">FAST DIGITAL PAY</text>
      <circle cx="185" cy="37.5" r="18" fill="#ffffff" opacity="0.2" />
      <path d="M 178 37.5 L 183 42.5 L 193 32.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- CBE BIRR -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="220" height="75" rx="16" fill="url(#cbePurple)" stroke="#c084fc" stroke-width="2" />
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">CBE BIRR</text>
      <text x="20" y="55" fill="#f3e8ff" font-family="monospace" font-weight="bold" font-size="13">BANK TRANSFER</text>
      <circle cx="185" cy="37.5" r="18" fill="#ffffff" opacity="0.2" />
      <path d="M 178 37.5 L 183 42.5 L 193 32.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- CASH -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="220" height="75" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">CASH ETB</text>
      <text x="20" y="55" fill="#dcfce7" font-family="monospace" font-weight="bold" font-size="13">DIRECT HANDOVER</text>
      <circle cx="185" cy="37.5" r="18" fill="#ffffff" opacity="0.2" />
      <path d="M 178 37.5 L 183 42.5 L 193 32.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Card Number & Holder Info -->
  <g transform="translate(45, 315)">
    <text x="0" y="24" fill="#fef08a" font-family="monospace" font-weight="bold" font-size="22" letter-spacing="6">GHOST • 0001 • 2026 • FIFA</text>
    <text x="0" y="55" fill="#a855f7" font-family="monospace" font-size="14" letter-spacing="2">STATION TV 1 - TV 2 - TV 3</text>
  </g>

  <!-- Bottom Right Decorative Stamps & Hologram -->
  <g transform="translate(580, 310)">
    <!-- Hologram Shield -->
    <rect x="0" y="0" width="175" height="70" rx="14" fill="#0f172a" stroke="url(#purpleGlow)" stroke-width="2" />
    <text x="87.5" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">VERIFIED CENTER</text>
    <text x="87.5" y="52" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">ETHIOPIA GAMING</text>
  </g>

  <!-- Card Footer Watermark / Signature -->
  <g transform="translate(45, 430)">
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="12">GHOST GAME ZONE MANAGEMENT SYSTEM V1.0</text>
    <text x="710" y="15" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" text-anchor="end">MADE BY YUNA 👻</text>
  </g>
</svg>
